name: Update Menu Data

on:
  schedule:
    # Saturday, Sunday and Monday at 09:00 UTC (06:00 BRT)
    - cron: "0 9 * * 0,1,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch weekly menu
        run: python scripts/fetch-menu.py

      - name: Show fetched dates
        run: |
          python - <<'PY'
          import json
          data = json.load(open("data/menus.json", encoding="utf-8"))
          for campus, rows in data.items():
              dates = [r["date"] for r in rows]
              print(f"{campus}: {min(dates) if dates else '-'} .. {max(dates) if dates else '-'}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          if git diff --staged --quiet; then
            echo "Sem mudanças no cardápio."
          else
            git commit -m "chore: atualiza cardápio semanal"
            git push
          fi
