name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Install Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;27.1.12297006"; then
              break
            fi
            echo "NDK install attempt $attempt failed; retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006" "$ANDROID_HOME/temp" 2>/dev/null || true
            sleep 10
          done
          "$SDKMANAGER" --list_installed | grep -i "ndk;27.1.12297006"

      - name: Enable APK Signature Schema v1
        run: |
          sed -i "s/keyPassword 'android'/keyPassword 'android'\n            v1SigningEnabled true\n            v2SigningEnabled true/" android/app/build.gradle
          grep -n "SigningEnabled" android/app/build.gradle
          grep -q "v1SigningEnabled true" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/unbru-${GITHUB_REF_NAME:-dev}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unbru-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
